<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Никита Ткаченко — АНО «ЭИСИ»</title>
<meta name="description" content="Контакты Никиты Ткаченко, АНО «ЭИСИ»">
<meta property="og:title" content="Никита Ткаченко — АНО «ЭИСИ»">
<meta property="og:description" content="Телефон, почта, Telegram. Сохраните контакт в один тап.">
<meta name="theme-color" content="#091B4C">
<meta name="color-scheme" content="light">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23A9B8E0'/%3E%3Cstop offset='.65' stop-color='%23091B4C'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='32' cy='32' r='32' fill='url(%23g)'/%3E%3Ctext x='32' y='41' font-family='Arial' font-weight='700' font-size='24' fill='white' text-anchor='middle'%3EНТ%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --navy: #091B4C;
    --blue: #516DBC;
    --ice: #E1ECF8;
    --paper: #F9F9F9;
    --grey: #A8A6A6;
    --icon: linear-gradient(135deg, #A9B8E0 0%, #3A4F8F 38%, #091B4C 75%);
    --icon-light: linear-gradient(135deg, #FFFFFF 0%, #F3F7FC 45%, #DCE6F5 100%);
    --shadow: 0 6px 18px rgba(9, 27, 76, .10);
    --gap: 16px;
  }
  * { box-sizing: border-box; margin: 0; }
  html { background: var(--paper); }
  body {
    font-family: Arial, "Helvetica Neue", Helvetica, sans-serif;
    color: #000;
    min-height: 100vh;
    background: linear-gradient(160deg, #FFFFFF 0%, var(--paper) 35%, var(--ice) 100%) fixed;
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    width: 100%; max-width: 480px; margin: 0 auto;
    padding: 0 16px 40px;
    display: grid; gap: var(--gap);
  }

  /* ---------- Шапка ---------- */
  .hero {
    margin: 0 -16px;
    padding: 40px 24px 60px;
    background: linear-gradient(135deg, var(--navy) 0%, #1E3373 45%, var(--blue) 100%);
    color: #fff;
    border-radius: 0 0 24px 24px;
    text-align: center;
    display: flex; flex-direction: column; align-items: center;
  }
  .emblem { height: 104px; margin-bottom: 22px; filter: drop-shadow(0 6px 16px rgba(0,0,0,.35)); }
  .emblem img { display: block; height: 100%; width: auto; }
  .avatar {
    width: 96px; height: 96px; margin-bottom: 20px; border-radius: 50%;
    background: var(--icon-light); color: var(--navy);
    display: grid; place-items: center;
    font-size: 34px; font-weight: 700;
    box-shadow: 0 8px 24px rgba(0,0,0,.25);
  }
  h1 { font-size: clamp(24px, 6.4vw, 28px); font-weight: 700; text-transform: uppercase; line-height: 1.15; letter-spacing: .3px; }
  .pill {
    display: inline-block; padding: 7px 18px; border-radius: 999px;
    font-size: 14px; text-transform: uppercase; letter-spacing: .3px;
  }
  .pill.outline { border: 1.5px solid #fff; color: #fff; margin-top: 14px; }
  .pill.fill { background: var(--blue); color: #fff; margin-bottom: 14px; font-size: 13px; }

  /* QR — виден только на компьютере */
  .qr { display: none; }

  /* ---------- Карточки ---------- */
  .card { background: #fff; border-radius: 16px; box-shadow: var(--shadow); padding: 20px; }
  .main { margin-top: calc(-36px - var(--gap)); position: relative; }

  .save {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    width: 100%; padding: 16px;
    background: var(--navy); color: #fff; text-decoration: none;
    border-radius: 999px; font-size: 16px; font-weight: 700; text-transform: uppercase; letter-spacing: .3px;
    transition: background .2s;
  }
  .save svg { width: 22px; height: 22px; }
  .save:hover { background: #142A6A; }

  .actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 16px; }
  .act {
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    padding: 14px 4px; border-radius: 16px;
    background: var(--ice); color: var(--navy); text-decoration: none;
    font-size: 13px; font-weight: 700; text-transform: uppercase;
    transition: background .2s, transform .1s;
  }
  .act:hover { background: #D3E2F4; }
  .save:active, .act:active, .row:active { transform: scale(.98); }

  .ic {
    width: 48px; height: 48px; border-radius: 50%; flex: none;
    background: var(--icon); color: #fff;
    display: grid; place-items: center;
  }
  .ic svg { width: 24px; height: 24px; }
  .ic.light { background: var(--icon-light); color: var(--navy); width: 44px; height: 44px; box-shadow: inset 0 0 0 1px #D5DFEE; }
  .ic.light svg { width: 22px; height: 22px; }

  .row {
    display: flex; align-items: center; gap: 14px;
    padding: 12px 0; color: inherit; text-decoration: none; min-width: 0;
  }
  .row + .row { border-top: 1px solid var(--ice); }
  .row > div { min-width: 0; }
  .row small { display: block; color: var(--blue); font-size: 12px; text-transform: uppercase; letter-spacing: .3px; margin-bottom: 3px; }
  .row span { font-size: 15px; overflow-wrap: anywhere; color: #000; }
  a.row:hover span { color: var(--blue); }

  .share {
    display: block; width: 100%; margin-top: 16px; padding: 13px;
    background: #fff; border: 1.5px solid var(--blue); border-radius: 999px;
    color: var(--navy); font: inherit; font-size: 14px; text-transform: uppercase; letter-spacing: .3px;
    cursor: pointer;
  }
  .share:hover { background: var(--ice); }
  footer { text-align: center; color: var(--grey); font-size: 12px; }

  /* ---------- Планшет ---------- */
  @media (min-width: 600px) {
    .wrap { max-width: 560px; padding-top: 32px; }
    .hero { margin: 0; border-radius: 24px; padding: 48px 32px 72px; }
    .emblem { height: 120px; }
    .card { padding: 24px; }
    .main { margin-top: calc(-48px - var(--gap)); margin-inline: 20px; }
  }

  /* ---------- Компьютер: две колонки ---------- */
  @media (min-width: 960px) {
    :root { --gap: 24px; }
    body { display: grid; place-items: center; padding: 40px 0; }
    .wrap {
      max-width: 1040px; padding: 0 32px;
      grid-template-columns: 400px 1fr;
      grid-template-areas: "hero main" "hero contacts" "foot foot";
      align-items: start;
    }
    .hero {
      grid-area: hero; align-self: stretch;
      padding: 48px 36px; justify-content: center;
    }
    .main { grid-area: main; margin: 0; }
    .contacts { grid-area: contacts; }
    footer { grid-area: foot; }
    .card { padding: 28px; }
    .emblem { height: 140px; margin-bottom: 26px; }
    h1 { font-size: 30px; }
    .qr {
      display: block; margin-top: 32px; text-align: center;
      font-size: 13px; color: var(--ice); line-height: 1.4;
    }
    .qr img {
      display: block; width: 168px; height: 168px; margin: 0 auto 12px;
      background: #fff; border-radius: 16px; padding: 10px;
    }
    .actions { gap: 16px; }
    .act { padding: 20px 8px; font-size: 14px; }
    .ic { width: 56px; height: 56px; }
    .ic svg { width: 28px; height: 28px; }
    .wrap { grid-template-rows: auto 1fr auto; }
    .contacts { align-self: stretch; }
    .row { padding: 14px 0; }
    .row span { font-size: 16px; }
    .share { display: none !important; }
  }
</style>
</head>
<body>
