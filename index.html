  .save {

    font-weight: 600; font-size: 17px;
  }
  .save:active { transform: scale(.98); }
  .actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 12px; }
  .act {
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    padding: 14px 4px; border-radius: 14px;
    background: var(--btn); color: var(--text);
    text-decoration: none; font-size: 13px; font-weight: 500;
  }
  .act svg { width: 24px; height: 24px; color: var(--accent); }
  .list { margin-top: 18px; border-top: 1px solid var(--line); }
  .row {
    display: flex; align-items: center; gap: 14px;
    padding: 14px 2px; border-bottom: 1px solid var(--line);
    color: inherit; text-decoration: none;
  }
  .row:last-child { border-bottom: 0; }
  .row svg { width: 20px; height: 20px; color: var(--muted); flex: none; }
  .row small { display: block; color: var(--muted); font-size: 12px; margin-bottom: 2px; }
  .row span { font-size: 15px; word-break: break-all; }
  .share {
    display: block; width: 100%; margin-top: 16px; padding: 14px;
    border: 1px solid var(--line); border-radius: 14px;
    background: transparent; color: var(--text); font: inherit; font-size: 15px;
    cursor: pointer;
  }
  footer { text-align: center; color: var(--muted); font-size: 12px; margin-top: 24px; }
